name: Update calendar data

on:
  schedule:
    - cron: "0 1 * * *"     # 01:00 UTC = 07:00 Dhaka — daily morning brief
    - cron: "17 */2 * * *"  # every 2 hours (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:        # manual "Run workflow" button
    inputs:
      simulate_block:
        description: "Test the ForexFactory-blocked alert (opens a test issue; the next normal run closes it)"
        type: boolean
        default: false

permissions:
  contents: write   # commit data/
  issues: write     # open/close the "ff-blocked" alert issue

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Fetch calendar + probabilities + briefs
        id: update
        run: python scripts/update.py

      # update.py rewrites a file only when its content really changed (timestamps,
      # volumes and <1.5-point probability jitter are ignored; 12h heartbeat), so an
      # empty diff here means nothing worth committing.
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No content changes — nothing to commit."
            exit 0
          fi
          git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push

      - name: Alert — ForexFactory blocked
        if: always() && (steps.update.outputs.ff_page_ok == 'false' || inputs.simulate_block)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          FF_HTTP: ${{ inputs.simulate_block && 'TEST' || steps.update.outputs.ff_http }}
          FF_REASON: ${{ inputs.simulate_block && 'পরীক্ষামূলক অ্যালার্ট (simulate_block) — আসল ব্লক নয়' || steps.update.outputs.ff_reason }}
          FF_FALLBACK: ${{ steps.update.outputs.ff_fallback }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ff_alert.sh blocked

      - name: Resolve — ForexFactory reachable again
        if: always() && steps.update.outputs.ff_page_ok == 'true' && !inputs.simulate_block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ff_alert.sh ok
