name: Update calendar data

on:
  schedule:
    - cron: "0 1 * * *"     # 01:00 UTC = 07:00 Dhaka — daily morning brief
    - cron: "17 */2 * * *"  # every 2 hours (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Fetch calendar + probabilities + briefs
        run: python scripts/update.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
